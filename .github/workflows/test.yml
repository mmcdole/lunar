name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  root:
    name: root (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: go vet ./...
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...

  benchmark-smoke:
    name: benchmark smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: benchmarks/go.mod
          cache-dependency-path: |
            go.mod
            benchmarks/go.mod
            benchmarks/go.sum
      - working-directory: benchmarks
        run: go vet ./...
      - working-directory: benchmarks
        run: go test ./...
      - working-directory: benchmarks
        run: >-
          GOGC=100 GOMEMLIMIT=off GOMAXPROCS=1
          go test -run '^$'
          -bench '^(BenchmarkPrograms|BenchmarkInterpreter|BenchmarkEmbedding)$'
          -benchtime=1x -count=1 -cpu=1

  cbor-smoke:
    name: CBOR smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: benchmarks/cbor/go.mod
          cache-dependency-path: |
            go.mod
            benchmarks/cbor/go.mod
            benchmarks/cbor/stock.mod
            benchmarks/cbor/stock.sum
      - working-directory: benchmarks/cbor
        run: go vet ./...
      - working-directory: benchmarks/cbor
        run: go test ./...
      - working-directory: benchmarks/cbor
        run: go vet -tags gopherlua_reference -modfile=stock.mod ./...
      - working-directory: benchmarks/cbor
        run: go test -tags gopherlua_reference -modfile=stock.mod ./...
